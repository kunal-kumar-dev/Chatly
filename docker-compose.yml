services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${CHATLY_DB_USER:-chatly}:${CHATLY_DB_PASSWORD:-chatly_password}@postgres:5432/chatly?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-chatly-files}
      S3_FORCE_PATH_STYLE: "true"
      API_PORT: 3001
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      NODE_ENV: production
    command: >
      sh -c "pnpm --filter @chatly/database prisma:push &&
      pnpm --filter @chatly/database prisma:seed &&
      pnpm --filter @chatly/api start:prod"
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: chatly-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CHATLY_DB_USER:-chatly}
      POSTGRES_PASSWORD: ${CHATLY_DB_PASSWORD:-chatly_password}
      POSTGRES_DB: chatly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${CHATLY_DB_USER:-chatly}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatly-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: chatly-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # Optional: ClamAV for virus scanning
  # clamav:
  #   image: clamav/clamav:latest
  #   container_name: chatly-clamav
  #   ports:
  #     - '3310:3310'
  #   volumes:
  #     - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # clamav_data:
